<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>IMPULSE | Sales Monitor</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0%,#473766 0%,#171525 42%,#0c0c16 100%);color:#f4efff;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;min-height:100vh}.wrap{max-width:880px;margin:auto;padding:50px 22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{color:#bba5ed;letter-spacing:.22em;font-size:12px;font-weight:700}.tag{border:1px solid #675581;border-radius:99px;padding:8px 12px;color:#d2c2f4;font-size:12px}h1{font-size:clamp(32px,6vw,64px);line-height:1.05;margin:28px 0 8px}p{color:#bdb4d0}.panel{background:#ffffff0b;border:1px solid #ffffff24;border-radius:18px;padding:28px;margin-top:24px;backdrop-filter:blur(8px)}.label{color:#b6a6d0;font-size:12px;letter-spacing:.14em}.value{font-size:clamp(64px,13vw,116px);font-weight:800;letter-spacing:-.06em;line-height:1.2}.unit{font-size:18px;color:#c6b9e1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{background:#ffffff09;border:1px solid #ffffff1c;border-radius:14px;padding:18px}.stat strong{font-size:24px;display:block;margin-top:8px}.sub{font-size:12px;color:#9e91b4;margin-top:12px}.chart{width:100%;height:220px;display:block}button,a.link{background:#9c7be3;border:0;border-radius:9px;padding:12px 16px;color:#140d22;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}button:hover,a.link:hover{background:#b89af0}footer{font-size:12px;color:#9f93b2;margin-top:25px;line-height:1.8}@media(max-width:620px){.stats{grid-template-columns:1fr}.wrap{padding-top:26px}.panel{padding:20px}}</style></head><body><main class="wrap"><header><span class="eyebrow">XDINARY HEROES / IMPULSE</span><span class="tag" id="status">等待資料</span></header><h1>Sales Monitor<span style="color:#b99df5">.</span></h1><p>K-MONSTAR 商品公開資料監測 · 分享版</p><section class="panel"><div class="label">PLATFORM REPORTED TOTAL SOLD</div><div><span class="value" id="total">—</span> <span class="unit">件</span></div><div class="sub" id="updated">尚無成功讀取紀錄</div></section><section class="stats" style="margin-top:14px"><div class="stat"><div class="label">相較上次</div><strong id="delta">—</strong></div><div class="stat"><div class="label">觀測期間變化</div><strong id="since">—</strong></div><div class="stat"><div class="label">資料點數</div><strong id="count">—</strong></div></section><section class="panel"><div class="label">HISTORICAL TREND</div><svg class="chart" id="chart" viewBox="0 0 800 220" role="img" aria-label="銷量趨勢圖"><text x="400" y="110" text-anchor="middle" fill="#a99cbd">尚無歷史資料</text></svg></section><div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:24px"><button onclick="load()">重新整理</button><a class="link" href="https://www.kmonstar.com.tw/products/%E6%87%89%E5%8B%9F-261129-xdinary-heroes-9th-mini-album-impulse-%E5%B0%88%E8%BC%AF%E7%99%BC%E8%A1%8C%E7%B4%80%E5%BF%B5%E8%A6%96%E8%A8%8A%E7%B0%BD%E5%90%8D%E6%9C%83" target="_blank" rel="noopener">查看原始商品</a></div><footer>此數字為 CYBERBIZ 公開商品 JSON 的 total_sold 欄位，不代表已驗證的實際應募專輯張數；可能延遲或與最終訂單數不同。每 15 分鐘嘗試採樣一次。網站採「知道連結即可查看」，並非真正存取管制；連結被轉傳後其他人也能查看。</footer></main><script>async function load(){const s=document.getElementById('status');try{const r=await fetch('data/history.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('資料檔尚未建立');const rows=await r.json();const valid=rows.filter(x=>Number.isFinite(x.total_sold));if(!valid.length)throw Error('尚無有效銷量資料');const last=valid.at(-1),prev=valid.at(-2),first=valid[0];document.getElementById('total').textContent=last.total_sold.toLocaleString('zh-TW');document.getElementById('updated').textContent='最後成功讀取：'+new Date(last.timestamp).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});document.getElementById('delta').textContent=prev?(last.total_sold-prev.total_sold>=0?'+':'')+(last.total_sold-prev.total_sold):'—';document.getElementById('since').textContent=(last.total_sold-first.total_sold>=0?'+':'')+(last.total_sold-first.total_sold);document.getElementById('count').textContent=valid.length;const age=Date.now()-Date.parse(last.timestamp);s.textContent=age>40*60*1000?'資料可能過期':'已取得資料';const svg=document.getElementById('chart');if(valid.length===1){svg.innerHTML='<text x="400" y="110" text-anchor="middle" fill="#a99cbd">已有第一筆資料，等待後續採樣</text>';return}const min=Math.min(...valid.map(x=>x.total_sold)),max=Math.max(...valid.map(x=>x.total_sold)),span=Math.max(1,max-min),points=valid.map((x,i)=>`${25+i*750/(valid.length-1)},${190-(x.total_sold-min)/span*150}`).join(' ');svg.innerHTML=`<line x1="25" y1="190" x2="775" y2="190" stroke="#675581"/><polyline points="${points}" fill="none" stroke="#b99df5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="25" y="210" fill="#9f93b2" font-size="12">${min}</text><text x="775" y="30" text-anchor="end" fill="#9f93b2" font-size="12">${max}</text>`}catch(e){s.textContent='尚無可用資料';document.getElementById('updated').textContent=e.message}}load();setInterval(load,60000)</script></body></html>
